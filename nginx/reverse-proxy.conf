# ModSecurity laden
load_module modules/ngx_http_modsecurity_module.so;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Lasttests senden bis zu 5 MB Request Body an /api/... ;
    # nginx Default (1m) wuerde sonst HTTP 413 ohne Weiterleitung ans Backend antworten.
    client_max_body_size 6m;

    # Docker-DNS: Container bekommen beim Neu-Erstellen ggf. eine neue IP.
    # `resolve` in den Upstreams loest die Namen laufend neu auf (statt nur
    # beim Start); die Grafana-Location nutzt den Resolver ebenfalls.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:80   resolve max_fails=3 fail_timeout=10s;
        server frontend-2:80 resolve max_fails=3 fail_timeout=10s;
    }

    upstream api_upstream {
        zone api_upstream 64k;
        server load-balancer:80 resolve;
    }

    # WebSocket-Upgrade (Grafana Live) nur weiterreichen, wenn der Client es anfragt.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Port 80: Eigener Healthcheck bleibt direkt erreichbar (fuer Docker),
    # alles andere wird permanent auf HTTPS umgeleitet.
    server {
        listen 80;
        listen [::]:80;

        location = /rp-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Port 443: TLS-terminierender Server fuer alle oeffentlichen Endpunkte.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # WAF aktivieren
        modsecurity on;
        modsecurity_rules_file /etc/modsecurity.d/setup.conf;

        # Oeffentlicher Health-Endpunkt der Gesamtanwendung:
        # proxied an das Backend (via Load Balancer), das DB-Verbindung prueft.
        location = /health {
            limit_except GET {
                deny all;
            }
            proxy_pass http://api_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API-Requests gehen an den Load Balancer, der auf backend-1/2 verteilt.
        # proxy_pass ohne abschliessenden Slash erhaelt den vollen Pfad /api/...,
        # sodass das Backend genau das sieht, was der Client geschickt hat.
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana (Monitoring-UI) nur ueber HTTPS + WAF, kein eigener Host-Port.
        # Grafana laeuft mit serve_from_sub_path, bekommt also den vollen Pfad
        # /grafana/... . Der Name wird per Variable erst zur Laufzeit aufgeloest:
        # So startet der Reverse-Proxy auch, wenn Grafana (noch) nicht laeuft,
        # und die Webanwendung haengt nicht vom Monitoring ab.
        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Alles andere -> Frontend (statische HTML/CSS).
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Interner Server fuer Monitoring. Port 8080 wird in compose NICHT
    # an den Host gemappt -> nur containerintern erreichbar (nginx-exporter).
    server {
        listen 8080;

        location = /stub_status {
            stub_status;
            access_log off;
        }
    }
}
