events {
    worker_connections 1024;
}

http {
    # Lasttests senden bis zu 5 MB Request Body; nginx-Default (1m) wuerde
    # sonst mit HTTP 413 antworten, bevor das Backend ueberhaupt traffic sieht.
    client_max_body_size 6m;

    # Docker-DNS: Container bekommen beim Neu-Erstellen ggf. eine neue IP.
    # Mit `resolve` loest nginx die Namen laufend neu auf (statt nur beim
    # Start) und schickt so nie an eine veraltete Adresse.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Round-Robin ist der Default ueber alle Server in einem Upstream-Block.
    # max_fails/fail_timeout: passive Healthchecks - faellt ein Backend
    # 3x in 30s aus, wird es kurzzeitig aus der Rotation genommen.
    upstream backends {
        zone backends 64k;
        server backend-1:3000 resolve max_fails=3 fail_timeout=30s;
        server backend-2:3000 resolve max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        listen [::]:80;

        # Eigener Health-Endpunkt: antwortet direkt aus Nginx (ohne Proxy),
        # damit der Docker-Healthcheck nur das Nginx selbst prueft.
        location = /lb-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # --- NEU: Fail Fast Timeouts ---
            # Gibt nach 5 Sekunden auf, wenn das Backend nicht antwortet
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            # -------------------------------

            # Bei Fehlern automatisch das naechste Backend versuchen.
            # Bewusst OHNE http_503: Ein Backend antwortet nur dann mit 503,
            # wenn die Datenbank fehlt - das betrifft alle Backends gleich.
            # Ein Retry hilft nicht, und nginx wuerde die Backends sonst als
            # defekt sperren und "502 no live upstreams" statt der eigentlichen
            # 503 ("db: disconnected") liefern.
            proxy_next_upstream error timeout http_502 http_504;
        }
    }
}
